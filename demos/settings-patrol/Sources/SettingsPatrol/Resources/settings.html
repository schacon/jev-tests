<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title>
<style>
:root { --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --canvas:#fff; --subtle:#f6f8fa; --accent:#0969da;
  --danger:#d1242f; --success:#1a7f37; --sel:#e4ebf2; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color:var(--fg); background:var(--canvas); }
header.top { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--subtle); border-bottom:1px solid var(--border); }
.avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#8250df,#0969da); }
.avatar.org { border-radius:6px; background:linear-gradient(135deg,#1a7f37,#0969da); }
header.top .who { font-weight:600; font-size:16px; }
header.top .kind { color:var(--muted); font-size:12px; }
header.top .note { margin-left:auto; font-size:11px; color:var(--muted); border:1px dashed var(--border); padding:2px 8px; border-radius:10px; }
.layout { display:flex; max-width:1280px; margin:0 auto; padding:24px 24px 120px; gap:24px; }
nav { width:256px; flex:none; }
nav h3 { font-size:12px; font-weight:600; color:var(--muted); margin:16px 8px 4px; }
nav hr { border:0; border-top:1px solid var(--border); margin:8px 0; }
nav a { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; color:var(--fg); text-decoration:none; cursor:pointer; position:relative; }
nav a:hover { background:var(--subtle); }
nav a.active { background:var(--sel); font-weight:600; }
nav a.active::before { content:""; position:absolute; left:-8px; top:6px; bottom:6px; width:4px; border-radius:6px; background:var(--accent); }
nav a .ic { width:16px; text-align:center; color:var(--muted); font-size:13px; }
nav a .heat { margin-left:auto; height:6px; border-radius:3px; background:#fb8f44; }
main { flex:1; min-width:0; }
h1.page { font-size:24px; font-weight:400; margin:0 0 8px; padding-bottom:8px; border-bottom:1px solid var(--border); }
section { margin:24px 0 8px; }
section h2 { font-size:20px; font-weight:400; margin:0 0 8px; padding-bottom:8px; border-bottom:1px solid var(--border); }
section.danger h2 { color:var(--fg); border:0; }
section.danger .box { border:1px solid var(--danger); border-radius:6px; }
section.danger .ctl { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; margin:0; }
section.danger .ctl:last-child { border-bottom:0; }
.ctl { position:relative; margin:16px 0; border-radius:6px; transition:box-shadow .3s; }
.ctl label.name { display:block; font-weight:600; margin-bottom:6px; }
.ctl .desc { color:var(--muted); font-size:12px; margin-top:4px; }
.ctl input[type=text], .ctl textarea, .ctl select { font:inherit; padding:5px 12px; border:1px solid var(--border); border-radius:6px; background:var(--canvas); width:100%; max-width:440px; }
.ctl textarea { min-height:64px; }
.row { display:flex; gap:8px; align-items:flex-start; }
.row input[type=checkbox], .row input[type=radio] { margin-top:4px; }
.radio-opt { display:flex; gap:8px; align-items:center; margin:4px 0; }
.btn { font:inherit; font-weight:500; font-size:14px; padding:5px 16px; border:1px solid var(--border); border-radius:6px; background:var(--subtle); color:var(--fg); cursor:default; }
.btn.danger { color:var(--danger); }
.toggle { width:40px; height:22px; border-radius:11px; background:#818b98; position:relative; display:inline-block; vertical-align:middle; }
.toggle.on { background:var(--success); }
.toggle::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .2s; }
.toggle.on::after { left:21px; }
.list { border:1px solid var(--border); border-radius:6px; max-width:720px; }
.list div { padding:8px 16px; border-top:1px solid var(--border); font-size:13px; }
.list div:first-child { border-top:0; }
.info { background:var(--subtle); border:1px solid var(--border); border-radius:6px; padding:12px 16px; }
.link { color:var(--accent); }
.ctl.halo { box-shadow:0 0 0 3px color-mix(in srgb, var(--halo) 60%, transparent), 0 0 22px color-mix(in srgb, var(--halo) 55%, transparent); }
.ctl .pct { position:absolute; right:-6px; top:-10px; font:600 10px ui-monospace,Menlo,monospace; color:#fff; background:var(--halo); padding:1px 6px; border-radius:8px; z-index:2; }
.ctl.target { animation:pulse 1.1s ease-in-out 3; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 3px rgba(26,127,55,.9), 0 0 24px rgba(26,127,55,.6); } 50% { box-shadow:0 0 0 8px rgba(26,127,55,.25), 0 0 40px rgba(26,127,55,.2); } }
.ctl.target.halo { --halo:#1a7f37; }
</style></head>
<body>
<header class="top"><div class="avatar" id="avatar"></div><div><div class="who" id="who"></div><div class="kind" id="kind"></div></div>
<span class="note">local recreation for an on-device search demo</span></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<script>
const ICONS = { person:"◉", gear:"⚙", paintbrush:"✎", accessibility:"♿", bell:"🔔︎", "credit-card":"▭", mail:"✉", "shield-lock":"⛨", broadcast:"◎",
  key:"⚿", organization:"▦", globe:"◍", report:"⚑", repo:"▤", codespaces:"▣", "ai-model":"✦", package:"⬡", copilot:"◈", browser:"▢",
  reply:"↩", "shield-check":"⛨", apps:"▦", clock:"◷", log:"≡", heart:"♡", code:"‹›", law:"⚖", "id-badge":"▭", people:"☺", "arrow-switch":"⇄",
  project:"▥", play:"▶", webhook:"⚯", "comment-discussion":"❝", server:"▤", checklist:"☑", verified:"✓", lock:"🔒︎", trash:"🗑︎" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
let data = null, current = null;

function control(c) {
  const d = c.description ? `<div class="desc">${esc(c.description)}</div>` : "";
  switch (c.type) {
    case "text": return `<label class="name">${esc(c.label)}</label><input type="text" value="${esc(c.value)}" placeholder="${esc(c.placeholder)}">${d}`;
    case "textarea": return `<label class="name">${esc(c.label)}</label><textarea placeholder="${esc(c.placeholder)}">${esc(c.value)}</textarea>${d}`;
    case "select": return `<label class="name">${esc(c.label)}</label><select>${c.options.map((o) => `<option ${o === c.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${d}`;
    case "radio": return `<label class="name">${esc(c.label)}</label>${d}${c.options.map((o) => `<div class="radio-opt"><input type="radio" name="${c.id}" ${o === c.value ? "checked" : ""}><span>${esc(o)}</span></div>`).join("")}`;
    case "checkbox": return `<div class="row"><input type="checkbox" ${c.value ? "checked" : ""}><div><label class="name" style="margin:0">${esc(c.label)}</label>${d}</div></div>`;
    case "toggle": return `<div class="row"><span class="toggle ${c.value ? "on" : ""}"></span><div><label class="name" style="margin:0">${esc(c.label)}</label>${d}</div></div>`;
    case "button": return `<button class="btn">${esc(c.label)}</button>${d}`;
    case "danger-button": return `<div style="flex:1"><label class="name" style="margin:0">${esc(c.label)}</label>${d}</div><button class="btn danger">${esc(c.label)}</button>`;
    case "list": return `<label class="name">${esc(c.label)}</label>${d}<div class="list">${(c.items || []).map((i) => `<div>${esc(i)}</div>`).join("") || "<div>None</div>"}</div>`;
    case "link": return `<a class="link">${esc(c.label)}</a>${d}`;
    default: return `<div class="info"><strong>${esc(c.label)}</strong>${d}</div>`;
  }
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = data.groups.map((g) => {
    const head = g.title ? `<h3>${esc(g.title)}</h3>` : (g.id.endsWith("developer") ? "<hr>" : "");
    return head + g.pages.map((p) => `<a data-page="${p.id}" class="${p.id === current ? "active" : ""}"><span class="ic">${ICONS[p.icon] || "•"}</span>${esc(p.title)}<span class="heat" style="width:0"></span></a>`).join("");
  }).join("");
  nav.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => Patrol.show(a.dataset.page)));
}

function page(id) { for (const g of data.groups) for (const p of g.pages) if (p.id === id) return p; return null; }

window.Patrol = {
  load(json, pageId) {
    data = json;
    const org = data.scope === "org";
    document.getElementById("who").textContent = data.title;
    document.getElementById("kind").textContent = org ? "Organization account" : "Your personal account";
    document.getElementById("avatar").className = "avatar" + (org ? " org" : "");
    this.show(pageId || data.groups[0].pages[0].id);
    return true;
  },
  show(id) {
    const p = page(id); if (!p) { return false; }
    current = id;
    renderNav();
    document.getElementById("main").innerHTML = `<h1 class="page">${esc(p.title)}</h1>` + p.sections.map((s) => {
      const body = s.controls.map((c) => `<div class="ctl" id="${c.id}">${control(c)}</div>`).join("");
      return s.danger
        ? `<section class="danger"><h2>${esc(s.title)}</h2><div class="box">${body}</div></section>`
        : `<section><h2>${esc(s.title)}</h2>${s.description ? `<div class="desc">${esc(s.description)}</div>` : ""}${body}</section>`;
    }).join("");
    scrollTo(0, 0);
    return true;
  },
  // halos: [{id, p}] for controls; pages: [{id, p}] heat bars in the nav.
  halos(controls, pages) {
    document.querySelectorAll(".ctl").forEach((el) => { el.classList.remove("halo", "target"); el.querySelector(".pct")?.remove(); });
    const top = Math.max(...controls.map((c) => c.p), 0.0001);
    controls.forEach(({ id, p }) => {
      const el = document.getElementById(id); if (!el) { return; }
      const hue = 30 + 90 * (p / top);
      el.style.setProperty("--halo", `hsl(${hue} 80% 45% / ${0.35 + 0.65 * p / top})`);
      el.classList.add("halo");
      el.insertAdjacentHTML("beforeend", `<span class="pct">${(p * 100).toFixed(p < 0.1 ? 1 : 0)}%</span>`);
    });
    const ptop = Math.max(...(pages || []).map((x) => x.p), 0.0001);
    (pages || []).forEach(({ id, p }) => {
      const bar = document.querySelector(`nav a[data-page="${id}"] .heat`);
      if (bar) { bar.style.width = Math.max(4, 48 * p / ptop) + "px"; }
    });
    return true;
  },
  focus(id) {
    const el = document.getElementById(id); if (!el) { return false; }
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.add("target");
    return true;
  },
};
</script></body></html>
