<!doctype html><html><head><meta charset="utf-8"><title>Checkout</title><link rel="stylesheet" href="style.css">
<style>:root{--bg:#f6f3ee;--accent:#1f7a4d}</style></head><body>
<header class="brand">🛒 Parcel &amp; Pine — Secure checkout</header>
<main>
<h1>Checkout</h1><p class="lede">3 items · Order total $184.20</p>
<fieldset><legend>Contact</legend><div class="row">
<div><label for="email">Email</label><input id="email" type="email"></div>
<div><label for="phone">Phone</label><input id="phone" type="tel"></div></div></fieldset>
<fieldset><legend>Shipping address</legend><div class="row">
<div><label for="first">First name</label><input id="first" type="text"></div>
<div><label for="last">Last name</label><input id="last" type="text"></div></div>
<div class="row"><div><label for="addr1">Street address</label><input id="addr1" type="text"></div>
<div><label for="addr2">Apartment, suite, etc. (optional)</label><input id="addr2" type="text"></div></div>
<div class="row"><div><label for="city">City</label><input id="city" type="text"></div>
<div><label for="state">State</label><input id="state" type="text"></div>
<div><label for="zip">ZIP code</label><input id="zip" type="text"></div></div></fieldset>
<fieldset><legend>Payment</legend><div class="row">
<div><label for="ccname">Name on card</label><input id="ccname" type="text"></div>
<div><label for="ccnum">Card number</label><input id="ccnum" type="text" placeholder="1234 1234 1234 1234"></div></div>
<div class="row"><div><label for="ccexp">Expiration (MM/YY)</label><input id="ccexp" type="text"></div>
<div><label for="cvc">Security code</label><input id="cvc" type="text" placeholder="CVC"></div>
<div><label for="promo">Promo code</label><input id="promo" type="text"></div></div>
<div class="check"><input id="same" type="checkbox"><label for="same">Billing address same as shipping</label></div>
<div class="check"><input id="news" type="checkbox"><label for="news">Email me about sales and new arrivals</label></div></fieldset>
<button type="button">Place order</button></main></body></html>
