<!doctype html><html><head><meta charset="utf-8"><title>Employee's Withholding Certificate</title><link rel="stylesheet" href="style.css">
<style>:root{--bg:#f3f1ea;--accent:#6b4f1b} main{font-family: "Iowan Old Style", Georgia, serif}</style></head><body>
<header class="brand">📄 Form W-4-S (sample) · Employee's Withholding Certificate · 2026</header>
<main>
<h1>Step 1: Personal information</h1><p class="lede">Give Form W-4-S to your employer. Your withholding is subject to review.</p>
<fieldset><legend>Step 1</legend><div class="row">
<div><label for="a1">(a) First name and middle initial</label><input id="a1" type="text"></div>
<div><label for="a2">Last name</label><input id="a2" type="text"></div>
<div><label for="b">(b) Social security number</label><input id="b" type="text"></div></div>
<div class="row"><div><label for="c1">Address</label><input id="c1" type="text"></div>
<div><label for="c2">City or town, state, and ZIP code</label><input id="c2" type="text"></div></div>
<div class="row"><div><label for="fs">(c) Filing status</label><select id="fs"><option></option><option>Single or Married filing separately</option><option>Married filing jointly</option><option>Head of household</option></select></div></div>
</fieldset>
<fieldset><legend>Step 2 – 4</legend>
<div class="check"><input id="two" type="checkbox"><label for="two">Step 2(c): Check here if there are only two jobs total</label></div>
<div class="row"><div><label for="dep">Step 3: Claim dependent and other credits ($)</label><input id="dep" type="text"></div>
<div><label for="oth">4(a) Other income (not from jobs)</label><input id="oth" type="text"></div></div>
<div class="row"><div><label for="ded">4(b) Deductions</label><input id="ded" type="text"></div>
<div><label for="ext">4(c) Extra withholding per pay period</label><input id="ext" type="text"></div></div></fieldset>
<fieldset><legend>Employers only</legend><div class="row">
<div><label for="en">Employer's name and address</label><input id="en" type="text"></div>
<div><label for="fe">First date of employment</label><input id="fe" type="text"></div>
<div><label for="ein">Employer identification number (EIN)</label><input id="ein" type="text"></div></div></fieldset>
<div class="check"><input id="sig" type="checkbox"><label for="sig">Under penalties of perjury, I declare that this certificate is true, correct, and complete</label></div>
<button type="button">Sign and submit</button></main></body></html>
