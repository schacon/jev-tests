<!doctype html><html><head><meta charset="utf-8"><title>Application for Passport Renewal</title><link rel="stylesheet" href="style.css">
<style>:root{--bg:#eef1f6;--accent:#1b3a6b} header.brand{color:#1b3a6b}</style></head><body>
<header class="brand">🏛️ Department of Travel Documents (sample)</header>
<main>
<h1>Passport Renewal by Mail</h1><p class="lede">Form DTD-82 · Complete all required fields in black ink equivalents.</p>
<fieldset><legend>1. Applicant</legend><div class="row">
<div><label for="ln">Last name</label><input id="ln" type="text"></div>
<div><label for="fn">First name</label><input id="fn" type="text"></div>
<div><label for="mn">Middle name</label><input id="mn" type="text"></div></div>
<div class="row"><div><label for="dob">Date of birth (mm/dd/yyyy)</label><input id="dob" type="text"></div>
<div><label for="pob">Place of birth (city &amp; state or country)</label><input id="pob" type="text"></div>
<div><label for="sex">Sex</label><select id="sex"><option></option><option>F</option><option>M</option><option>X</option></select></div></div>
<div class="row"><div><label for="ssn">Social Security number</label><input id="ssn" type="text"></div>
<div><label for="hgt">Height</label><input id="hgt" type="text"></div>
<div><label for="eye">Eye color</label><input id="eye" type="text"></div></div></fieldset>
<fieldset><legend>2. Mailing address</legend><div class="row">
<div><label for="st">Street / RFD # or P.O. box</label><input id="st" type="text"></div>
<div><label for="cty">City</label><input id="cty" type="text"></div></div>
<div class="row"><div><label for="sta">State</label><input id="sta" type="text"></div>
<div><label for="zp">ZIP code</label><input id="zp" type="text"></div>
<div><label for="em">Email address</label><input id="em" type="email"></div>
<div><label for="ph">Primary contact phone number</label><input id="ph" type="tel"></div></div></fieldset>
<fieldset><legend>3. Most recent passport</legend><div class="row">
<div><label for="ppn">Passport book number</label><input id="ppn" type="text"></div>
<div><label for="ppd">Issue date (mm/dd/yyyy)</label><input id="ppd" type="text"></div></div>
<div class="row"><div><label for="emn">Emergency contact name</label><input id="emn" type="text"></div>
<div><label for="emp">Emergency contact phone</label><input id="emp" type="tel"></div></div>
<div class="check"><input id="cert" type="checkbox"><label for="cert">I certify that the information in this application is true and correct</label></div></fieldset>
<button type="button">Submit application</button></main></body></html>
